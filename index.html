<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Tee Vision</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#15201a; --muted:#5b665f; --line:#d9ded8;
    --accent:#14532d; --accent-2:#1f7a4d; --tee:#ffffff; --tgt:#e11d48;
    --dim:#ffd400; --sand:#c9a227; --water:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    -webkit-text-size-adjust:100%}
  header{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--accent);color:#fff}
  header h1{font-size:16px;margin:0;letter-spacing:.04em;font-weight:700}
  header .sub{font-size:11px;opacity:.75}
  header .spacer{flex:1}
  .holenav{display:flex;align-items:center;gap:6px;min-width:0}
  .holenav[hidden]{display:none}
  .holenav button{min-height:36px;min-width:40px;padding:0;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35);font-size:18px}
  .holenav button:disabled{opacity:.35}
  #navName{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
  @media (max-width:600px){ header .sub{display:none} header h1{font-size:14px} }
  #map,#view3d{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 44px)}
  #view3d{background:#cfe6f5}
  #view3d[hidden],#map[hidden]{display:none}
  .sheet{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:1001;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
    box-shadow:0 6px 24px rgba(0,0,0,.18);max-height:46vh;overflow:auto}
  .sheet[hidden]{display:none}
  .sheet.folded #details3d{display:none}
  button.fold{min-width:44px;padding:0;font-size:16px}
  button.fold.mini{margin-left:auto}
  #btnRestore{position:fixed;left:calc(env(safe-area-inset-left) + 8px);bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:1001;
    min-width:48px;min-height:48px;padding:0;font-size:18px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
  #btnRestore[hidden]{display:none}
  @media (max-width:600px){
    .sheet{padding:8px}
    #sheet3d .row:first-child{gap:4px}
    #sheet3d .row:first-child button,#sheet3d .row:first-child select{min-height:36px;padding:0 9px;font-size:13px}
    #details3d{max-height:32vh;overflow:auto}
  }
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .row + .row{margin-top:8px}
  button,select,input{font:inherit;font-size:14px;min-height:40px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:0 12px}
  input{flex:1;min-width:0}
  button{cursor:pointer;font-weight:600}
  button.primary{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
  button.primary:disabled{opacity:.4}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;border-radius:0;min-height:38px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
  .hz{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .hz td{padding:4px 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
  .hz td:last-child{text-align:right;font-weight:700}
  .tag{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .note{font-size:11px;color:var(--muted);margin-top:6px}
  /* PMI-style labels */
  .pmi{font:600 12px/1.25 ui-monospace,"SF Mono",Menlo,monospace;background:rgba(255,255,255,.93);
    color:#111;border:1.5px solid #111;padding:2px 6px;border-radius:3px;white-space:nowrap;
    pointer-events:none;font-variant-numeric:tabular-nums}
  .pmi.dist{border-color:#111;background:#ffd400}
  .pmi.sand{border-color:var(--sand)}
  .pmi.water{border-color:var(--water);color:#0b3a9e}
  .pmi.tgt{border-color:var(--tgt);color:var(--tgt)}
  .pmi.pick{border-color:#7c3aed;color:#4c1d95}
  .pmi.width{background:#fff;border-style:dashed}
  .pmi.layup{border-color:#0891b2;background:#cffafe;color:#0e4f5c}
  .pmi.aimhead{border-color:#c026d3;background:#fae8ff;color:#701a75}
  .pmi.width.layup{background:#fff}
  select[hidden],button[hidden]{display:none}
  .pmi.aim{border-color:#c026d3;color:#701a75}
  .pmi.gsum{border-color:#14532d;background:#ecfdf5;color:#14532d}
  .pmi.cup{border-color:#e11d48;color:#e11d48}
  .pmi.ball{border-color:#111;background:#fff}
  .pmi.wind{border-color:#0369a1;background:#e0f2fe;color:#0c4a6e}
  #windInfo[hidden]{display:none}
  #loading{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;
    background:rgba(20,32,26,.55);color:#fff;font-size:15px}
  #loading[hidden]{display:none}
  #loading div{background:rgba(0,0,0,.6);padding:14px 18px;border-radius:12px}
  .attr3d{position:fixed;right:6px;top:calc(env(safe-area-inset-top) + 50px);z-index:1001;font-size:10px;
    background:rgba(255,255,255,.8);padding:2px 6px;border-radius:4px}
  .attr3d[hidden]{display:none}
  .leaflet-tooltip.ring{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:700;
    text-shadow:0 0 3px #000,0 0 3px #000}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <div class="brand"><h1>Tee Vision</h1><div class="sub">ホール3D距離ビュー</div></div>
  <div class="spacer"></div>
  <div class="holenav" id="holeNav" hidden>
    <button id="btnPrevHole" aria-label="前のホール">←</button>
    <span id="navName"></span>
    <button id="btnNextHole" aria-label="次のホール">→</button>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="tabs">
    <button data-tab="map" class="on">地図</button>
    <button data-tab="3d" id="tab3d" disabled>3D</button>
  </div>
</header>

<div id="map"></div>
<div id="view3d" hidden></div>
<div class="attr3d" id="attr3d" hidden>出典：国土地理院（シームレス空中写真・数値標高モデル）</div>

<!-- 2D sheet -->
<div class="sheet" id="sheet2d">
  <div class="row">
    <input id="q" value="兵庫県三木市吉川町新田682-1" aria-label="住所・地名">
    <button id="btnSearch">検索</button>
    <button id="btnGps">現在地</button>
  </div>
  <div class="row">
    <span class="stat">タップで置く:</span>
    <div class="seg" id="pickSeg">
      <button data-pick="tee" class="on">ティー</button>
      <button data-pick="tgt">ターゲット</button>
    </div>
    <span class="stat" id="len2d"></span>
  </div>
  <div class="row">
    <select id="holeSel" style="flex:1;min-width:0"><option value="">保存済みホール…</option></select>
    <button id="btnDel" title="選択中のホールを削除">削除</button>
  </div>
  <div class="row">
    <input id="bmUrl" type="url" inputmode="url" placeholder="ブックマークURL（1行1URLのテキスト）" aria-label="ブックマークURL">
    <button id="btnBm">読込</button>
  </div>
  <div class="row">
    <input id="holeName" placeholder="ホール名（例: レッド1番 白ティー）">
    <button id="btnSave">保存</button>
    <button id="btnShare">URLコピー</button>
  </div>
  <div class="row">
    <button class="primary" id="btnBuild" style="flex:1" disabled>3Dで見る</button>
  </div>
</div>

<!-- 3D sheet -->
<div class="sheet" id="sheet3d" hidden>
  <div class="row">
    <button id="btnTeeView">ティー視点</button>
    <button id="btnTopView">俯瞰</button>
    <button id="btnMeasure">2点計測</button>
    <button id="btnExag">起伏×1</button>
    <button id="btnElev" class="on">高低差</button>
    <button id="btnSand" class="on">砂</button>
    <button id="btnWater" class="on">池</button>
    <button id="btnRem">残りy</button>
    <select id="leaveSel" aria-label="残したい距離" hidden></select>
    <button id="btnMyPos">現在地</button>
    <button id="btnFollow">方角固定</button>
    <button id="btnGreen">グリーン</button>
    <button id="btnWind">風</button>
    <select id="windHour" aria-label="風の時刻" hidden></select>
    <button id="btnCalib" hidden title="スマホをターゲット方向に向けて押す">補正</button>
    <button id="btnMini" class="fold mini" title="パネルを最小化">◁</button>
    <button id="btnFold" class="fold" aria-expanded="true" title="詳細を折りたたむ">▾</button>
  </div>
  <div id="details3d">
    <div class="row" id="windInfo" hidden></div>
    <div class="row" id="pickInfo"><span class="stat">地形をタップすると、その地点までの距離を表示します</span></div>
    <table class="hz" id="hzTable"></table>
    <div class="note">ハザードとフェアウェイ幅は航空写真の色から自動推定した目安です。気になる所は「2点計測」で確認してください。</div>
  </div>
</div>

<button id="btnRestore" hidden title="パネルを開く" aria-label="パネルを開く">▷</button>

<div id="loading" hidden><div id="loadingMsg">読み込み中…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/* ---------- constants & helpers ---------- */
const YD = 0.9144;                      // 1 yard in metres
const R_EARTH = 6378137;
const D2R = Math.PI / 180;
const GSI_PHOTO = 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg';
const GSI_DEM5  = 'https://cyberjapandata.gsi.go.jp/xyz/dem5a_png/{z}/{x}/{y}.png';
const GSI_DEM10 = 'https://cyberjapandata.gsi.go.jp/xyz/dem_png/{z}/{x}/{y}.png';
// 兵庫県 1m DEM via AIST (note z/y/x order). Outside Hyogo the tiles are empty and we fall back to GSI.
const GSJ_HYOGO = 'https://tiles.gsj.jp/tiles/elev/hyogodem/{z}/{y}/{x}.png';
const ATTR = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">出典：国土地理院</a>';
const FALLBACK = [34.93, 135.13];      // rough area; the geocoder normally overrides this
const LATERAL = 110;                    // half-width of the modelled corridor (m)
const BACK = 40;                        // area behind the tee (m)
const RING_YD = [100, 150, 200, 250, 300];
const REM_YD = [50, 100, 150, 200];     // remaining-distance arcs around the target
const LEAVE_YD = [30, 40, 50, 60, 70, 80, 90, 100, 120];

const $ = id => document.getElementById(id);
const toYd = m => m / YD;
const fmtY = m => Math.round(toYd(m));
const fmtDh = m => { const v = toYd(m); return `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(1)}y`; }; // elevation change in yards
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

function lonLatToPx(lon, lat, z) {
  const n = 256 * 2 ** z;
  const s = Math.sin(lat * D2R);
  return [(lon + 180) / 360 * n, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n];
}

/* Local frame: origin at tee, +y toward target, +x to the right (metres). */
function makeFrame(tee, tgt) {
  const kx = R_EARTH * D2R * Math.cos(tee.lat * D2R), ky = R_EARTH * D2R;
  const e = (tgt.lon - tee.lon) * kx, n = (tgt.lat - tee.lat) * ky;
  const L = Math.hypot(e, n) || 1;
  const f = [e / L, n / L], r = [f[1], -f[0]];
  return {
    L, bearing: Math.atan2(e, n) / D2R,
    toLocal(lat, lon) { const ee = (lon - tee.lon) * kx, nn = (lat - tee.lat) * ky; return [ee * r[0] + nn * r[1], ee * f[0] + nn * f[1]]; },
    toLatLon(x, y) { const ee = x * r[0] + y * f[0], nn = x * r[1] + y * f[1]; return { lat: tee.lat + nn / ky, lon: tee.lon + ee / kx }; },
  };
}
function distM(a, b) {
  const kx = R_EARTH * D2R * Math.cos(a.lat * D2R), ky = R_EARTH * D2R;
  return Math.hypot((b.lon - a.lon) * kx, (b.lat - a.lat) * ky);
}

/* ---------- state ---------- */
const state = { tee: null, tgt: null, pick: 'tee', exag: 1, showElev: true, measure: false,
  mode: 'tee', leave: lsGet('teevision.leave', 50),
  show: { sand: lsGet('teevision.showSand', true), water: lsGet('teevision.showWater', true) } };

/* ---------- 2D map ---------- */
const map = L.map('map', { zoomControl: false }).setView(FALLBACK, 16);
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer(GSI_PHOTO, { maxZoom: 20, maxNativeZoom: 18, attribution: ATTR }).addTo(map);
const layer2d = L.layerGroup().addTo(map);

function redraw2D() {
  layer2d.clearLayers();
  if (state.tee) {
    for (const yd of [150, 200, 250]) {
      L.circle([state.tee.lat, state.tee.lon], { radius: yd * YD, color: '#ffd400', weight: 1.5, dashArray: '6 6', fill: false, interactive: false })
        .bindTooltip(`${yd}y`, { permanent: true, direction: 'top', className: 'ring', offset: [0, 0] }).addTo(layer2d);
    }
    L.circleMarker([state.tee.lat, state.tee.lon], { radius: 8, color: '#111', weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(layer2d);
  }
  if (state.tgt) L.circleMarker([state.tgt.lat, state.tgt.lon], { radius: 8, color: '#fff', weight: 2, fillColor: '#e11d48', fillOpacity: 1 }).addTo(layer2d);
  if (state.tee && state.tgt) {
    L.polyline([[state.tee.lat, state.tee.lon], [state.tgt.lat, state.tgt.lon]], { color: '#fff', weight: 2, dashArray: '4 6' }).addTo(layer2d);
    $('len2d').innerHTML = `<b>${fmtY(distM(state.tee, state.tgt))}</b>y`;
  } else $('len2d').textContent = '';
  $('btnBuild').disabled = !(state.tee && state.tgt);
}
function setPick(p) {
  state.pick = p;
  for (const b of $('pickSeg').children) b.classList.toggle('on', b.dataset.pick === p);
}
map.on('click', e => {
  const p = { lat: e.latlng.lat, lon: e.latlng.lng };
  if (state.pick === 'tee') { state.tee = p; setPick('tgt'); } else state.tgt = p;
  $('holeSel').value = '';   // edited by hand → no longer a saved hole
  redraw2D(); syncHash();
});
$('pickSeg').addEventListener('click', e => { if (e.target.dataset.pick) setPick(e.target.dataset.pick); });

/* geocoding (GSI address search) */
async function geocode(q) {
  const r = await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(q));
  const j = await r.json();
  if (!j.length) throw new Error('not found');
  const [lon, lat] = j[0].geometry.coordinates;
  return [lat, lon];
}
$('btnSearch').onclick = async () => {
  try { map.setView(await geocode($('q').value), 16); } catch { alert('見つかりませんでした'); }
};
$('btnGps').onclick = () => {
  if (!navigator.geolocation) return alert('位置情報が使えません');
  navigator.geolocation.getCurrentPosition(pos => {
    state.tee = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    map.setView([state.tee.lat, state.tee.lon], 17);
    setPick('tgt'); redraw2D(); syncHash();
  }, err => alert('位置情報を取得できませんでした: ' + err.message), { enableHighAccuracy: true, timeout: 15000 });
};

/* URL hash & saved holes */
function syncHash() {
  const p = new URLSearchParams();
  if (state.tee) p.set('t', `${state.tee.lat.toFixed(6)},${state.tee.lon.toFixed(6)}`);
  if (state.tgt) p.set('g', `${state.tgt.lat.toFixed(6)},${state.tgt.lon.toFixed(6)}`);
  const n = $('holeName').value.trim(); if (n) p.set('n', n);
  history.replaceState(null, '', '#' + p.toString());
}
function parseLL(s) { if (!s) return null; const [a, b] = s.split(',').map(Number); return isFinite(a) && isFinite(b) ? { lat: a, lon: b } : null; }
function loadHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.tee = parseLL(p.get('t')); state.tgt = parseLL(p.get('g'));
  if (p.get('n')) $('holeName').value = p.get('n');
  return !!state.tee;
}
const HKEY = 'teevision.holes';
function renderHoles() {
  const holes = lsGet(HKEY, []);
  $('holeSel').innerHTML = '<option value="">保存済みホール…</option>' +
    holes.map((h, i) => `<option value="${i}">${h.name.replace(/</g, '&lt;')}</option>`).join('');
}
$('btnSave').onclick = () => {
  if (!state.tee || !state.tgt) return alert('ティーとターゲットを置いてください');
  const name = $('holeName').value.trim() || `ホール ${new Date().toLocaleString('ja-JP')}`;
  const holes = lsGet(HKEY, []).filter(h => h.name !== name);
  holes.push({ name, tee: state.tee, tgt: state.tgt });
  holes.sort((a, b) => a.name.localeCompare(b.name, 'ja', { numeric: true }));
  lsSet(HKEY, holes); $('holeName').value = name; renderHoles(); syncHash();
};
// ← → in the header (3D view): step through saved holes in list order, wrapping around
function currentHoleIndex() {
  const holes = lsGet(HKEY, []), v = $('holeSel').value;
  if (v !== '' && holes[+v]) return +v;
  const same = (a, b) => a && b && Math.abs(a.lat - b.lat) < 1e-6 && Math.abs(a.lon - b.lon) < 1e-6;
  return holes.findIndex(h => same(h.tee, state.tee) && same(h.tgt, state.tgt));
}
function updateHoleNav() {
  const holes = lsGet(HKEY, []), in3d = !$('view3d').hidden;
  $('holeNav').hidden = !in3d || holes.length === 0;
  const i = currentHoleIndex();
  $('navName').textContent = i >= 0 ? holes[i].name : ($('holeName').value || '未保存のホール');
  $('btnPrevHole').disabled = $('btnNextHole').disabled = holes.length < (i >= 0 ? 2 : 1);
}
async function stepHole(dir) {
  const holes = lsGet(HKEY, []); if (!holes.length) return;
  const i = currentHoleIndex(), n = holes.length;
  const j = i < 0 ? (dir > 0 ? 0 : n - 1) : (i + dir + n) % n;
  $('holeSel').value = String(j); $('holeSel').onchange();
  updateHoleNav();
  await build();
  updateHoleNav();
}
$('btnPrevHole').onclick = () => stepHole(-1);
$('btnNextHole').onclick = () => stepHole(1);
$('holeSel').onchange = () => {
  const h = lsGet(HKEY, [])[+$('holeSel').value]; if (!h) return;
  state.tee = h.tee; state.tgt = h.tgt; $('holeName').value = h.name;
  map.fitBounds([[h.tee.lat, h.tee.lon], [h.tgt.lat, h.tgt.lon]], { padding: [40, 40] });
  setPick('tgt'); redraw2D(); syncHash();
};
$('btnDel').onclick = () => {
  const i = $('holeSel').value; if (i === '') return;
  const holes = lsGet(HKEY, []); if (!confirm(`「${holes[+i].name}」を削除しますか？`)) return;
  holes.splice(+i, 1); lsSet(HKEY, holes); renderHoles();
};
$('btnShare').onclick = async () => {
  syncHash();
  try { await navigator.clipboard.writeText(location.href); alert('URLをコピーしました'); }
  catch { prompt('このURLを共有してください', location.href); }
};
$('holeName').addEventListener('change', syncHash);

/* tabs */
function showTab(t) {
  for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.tab === t);
  $('map').hidden = t !== 'map'; $('sheet2d').hidden = t !== 'map';
  $('view3d').hidden = t !== '3d'; $('attr3d').hidden = t !== '3d'; applyMini(t === '3d'); updateHoleNav();
  if (t === 'map') map.invalidateSize(); else onResize();
}
$('tabs').addEventListener('click', e => { const t = e.target.dataset.tab; if (t && !e.target.disabled) showTab(t); });

/* ---------- tile loading ---------- */
async function loadTile(url) {
  const res = await fetch(url, { mode: 'cors' });
  if (!res.ok) throw new Error(res.status);
  const blob = await res.blob();
  if (window.createImageBitmap) {

function analyse(fr, photo, dems, Y0, Y1) {
  /* terrain grid, 2 m */
  const S = 2, nx = Math.round(2 * LATERAL / S) + 1, ny = Math.round((Y1 - Y0) / S) + 1;
  const H = new Float32Array(nx * ny);
  const hAt = (lat, lon) => { for (const d of dems) { const h = demAt(d, lat, lon); if (!isNaN(h)) return h; } return NaN; };
  let h0 = hAt(state.tee.lat, state.tee.lon); if (isNaN(h0)) h0 = 0;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const p = fr.toLatLon(-LATERAL + i * S, Y0 + j * S);
    const h = hAt(p.lat, p.lon); H[j * nx + i] = isNaN(h) ? h0 : h;
  }
  const hLocal = (x, y) => {
    const fx = Math.max(0, Math.min(nx - 1.001, (x + LATERAL) / S)), fy = Math.max(0, Math.min(ny - 1.001, (y - Y0) / S));
    const i = Math.floor(fx), j = Math.floor(fy), u = fx - i, v = fy - j, k = j * nx + i;
    return (H[k] * (1 - u) + H[k + 1] * u) * (1 - v) + (H[k + nx] * (1 - u) + H[k + nx + 1] * u) * v;
  };

  const cw = 2 * LATERAL + 1, ch = Math.floor(Y1 - Y0) + 1, N = cw * ch;
  const R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N), V = new Uint8Array(N);
  for (let j = 0; j < ch; j++) for (let i = 0; i < cw; i++) {
    const p = fr.toLatLon(i - LATERAL, Y0 + j), c = photoAt(photo, p.lat, p.lon), k = j * cw + i;
    if (c) { R[k] = c[0]; G[k] = c[1]; B[k] = c[2]; V[k] = 1; }
  }
  const blur = a => { // 3x3 box blur
    const o = new Float32Array(N);
    for (let j = 0; j < ch; j++) for (let i = 0; i < cw; i++) {
      let s = 0, n = 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= cw || jj >= ch) continue;
        const k = jj * cw + ii; if (V[k]) { s += a[k]; n++; }

  };

  for (let k = 0; k < N; k++) {
    if (!V[k]) continue;
    const r = Rb[k], g = Gb[k], b = Bb[k], br = (r + g + b) / 3, mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const sat = mx ? (mx - mn) / mx : 0;
    if (br > 165 && sat < 0.38 && r >= b + 8 && r >= g - 14) cls[k] = 2;
    else if (br < 95 && b >= r + 2 && b >= g - 12) cls[k] = 3;
    else if (g > r + 4 && g >= b) {
      cls[k] = 1;
      const i = k % cw, y = Math.floor(k / cw) + Y0;

  // If the light class still covers most of the corridor, split it once more.

  const widthAt = (y) => {
    const j = Math.round(y - Y0); if (j < 0 || j >= ch) return null;
    const row = Array.from({ length: cw }, (_, i) => fair[j * cw + i]);
    for (let i = 0; i < cw; i++) if (!row[i]) { // close gaps up to 3 m
      let e = i; while (e < cw && !row[e]) e++;

      i = e;
    }
    let best = null;
    for (let i = 0; i < cw; i++) if (row[i]) {

    while (st.length) {

      n++; sx += x; sy += y; if (d < dMin) { dMin = d; fp = [x, y]; } if (d > dMax) dMax = d;
      if (r < rMin) rMin = r; if (r > rMax) rMax = r;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= cw || jj >= ch) continue;
        const kk = jj * cw + ii; if (!seen[kk] && cls[kk] === c) { seen[kk] = 1; st.push(kk); }
      }

        side: Math.abs(cx) < 8 ? '' : cx > 0 ? '右' : '左' });

    const i = Math.round(x + LATERAL), j = Math.round(y - Y0); if (i < 0 || j < 0 || i >= cw || j >= ch) return null;
    const k = j * cw + i; return cls[k] === 2 ? '砂' : cls[k] === 3 ? '池' : fair[k] ? 'FW' : 'ラフ';

function buildScene(m, photo) {
  clearGroup(overlay); clearGroup(pickGroup);
  if (terrain) { terrain.geometry.dispose(); terrain.material.map?.dispose(); terrain.material.dispose(); scene.remove(terrain); }
  const { fr, nx, ny, S, Y0, H, h0 } = m;
  const pos = new Float32Array(nx * ny * 3), uv = new Float32Array(nx * ny * 2);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i, x = -LATERAL + i * S, y = Y0 + j * S, p = fr.toLatLon(x, y);
    const [px, py] = lonLatToPx(p.lon, p.lat, photo.z);

    uv.set([(px - photo.ox) / photo.w, 1 - (py - photo.oy) / photo.h], k * 2);
  }
  const idx = [];

    const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1; idx.push(a, b, c, b, d, c); // CCW seen from above → normals point up
  }

const gy = (x, y) => (model.hLocal(x, y) - model.h0) * state.exag;
const V3 = (x, y, lift = 0.4) => new THREE.Vector3(x, gy(x, y) + lift, -y);

function drawOverlay() {

  // target line
  const cl = []; for (let y = 0; y <= L; y += 4) cl.push(V3(0, y)); cl.push(V3(0, L));
  overlay.add(line(cl, 0xffffff, true));

  overlay.add(line([V3(0, L, 0), V3(0, L, 10)], 0xe11d48));
  const dh = model.hLocal(0, L) - model.h0;
  overlay.add(label(`ターゲット ${fmtY(L)}y` + (state.showElev ? ` 高低差${fmtDh(dh)}` : ''), 'tgt', V3(0, L, 11)));
  const rem = state.mode === 'rem';
  const dimW = (w, cls = 'width', col = 0xffffff, prefix = '幅') => {
    const z = 2.5;
    overlay.add(fatLine([V3(w.x0, w.y, z), V3(w.x1, w.y, z)], col, 2));
    overlay.add(fatLine([V3(w.x0, w.y, 0), V3(w.x0, w.y, z + 1)], col, 2));
    overlay.add(fatLine([V3(w.x1, w.y, 0), V3(w.x1, w.y, z + 1)], col, 2));
    overlay.add(label(`${prefix} ${fmtY(w.w)}y`, cls, V3((w.x0 + w.x1) / 2, w.y, z + 2.5)));
  };
  if (!rem) {

      const r = yd * YD; if (r > L + 40) continue;
      const pts = []; for (let a = -0.28; a <= 0.2801; a += 0.01) pts.push(V3(r * Math.sin(a), r * Math.cos(a)));
      overlay.add(line(pts, 0xffd400));

    }

    const arc = (r, col) => { const pts = []; for (let a = -0.5; a <= 0.5001; a += 0.01) pts.push(V3(r * Math.sin(a), L - r * Math.cos(a))); overlay.add(line(pts, col)); };
    for (const yd of REM_YD) {

    const txt = rem ? `${h.side}${name} 残り${fmtY(h.remFar)}–${fmtY(h.remNear)}y` : `${h.side}${name} ${fmtY(h.front)}–${fmtY(h.back)}y`;

function renderHazardTable() {

/* ---------- green view ---------- */
const GR = 26, GSTEP = 0.5, GEX = 4, GRAD_R = 12, CONTOUR_R = 17;
const greenGroup = new THREE.Group(); greenGroup.visible = false; scene.add(greenGroup);
const greenPick = new THREE.Group(); scene.add(greenPick);
let green = null, greenPts = [];
function setGroupVisible(g, v) { g.visible = v; g.traverse(o => { if (o.isCSS2DObject) o.visible = v; }); }

function boxBlur(src, n, r) {
  const tmp = new Float32Array(n * n), out = new Float32Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    let s = 0, c = 0; for (let d = -r; d <= r; d++) { const ii = i + d; if (ii >= 0 && ii < n) { s += src[j * n + ii]; c++; } } tmp[j * n + i] = s / c;
  }
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    let s = 0, c = 0; for (let d = -r; d <= r; d++) { const jj = j + d; if (jj >= 0 && jj < n) { s += tmp[jj * n + i]; c++; } } out[j * n + i] = s / c;
  }
  return out;
}

async function buildGreen() {
  const fr = model.fr, L = fr.L;
  const corners = [[-GR, L - GR], [GR, L - GR], [GR, L + GR], [-GR, L + GR]].map(([x, y]) => fr.toLatLon(x, y));
  const dh = await loadMosaic(GSJ_HYOGO, 18, corners);
  const n = Math.round(2 * GR / GSTEP) + 1, raw = new Float32Array(n * n);
  let valid = 0;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = -GR + i * GSTEP, y = L - GR + j * GSTEP, p = fr.toLatLon(x, y);
    let v = demAt(dh, p.lat, p.lon); if (!isNaN(v)) valid++; else v = model.hLocal(x, y);
    raw[j * n + i] = v;
  }
  const hiRes = valid / (n * n) > 0.8;
  const H = boxBlur(boxBlur(raw, n, 2), n, 2);           // ~1 m smoothing to suppress DEM noise
  const idx = (x, y) => [Math.max(0, Math.min(n - 1.001, (x + GR) / GSTEP)), Math.max(0, Math.min(n - 1.001, (y - (L - GR)) / GSTEP))];
  const hAt = (x, y) => {
    const [fx, fy] = idx(x, y), i = Math.floor(fx), j = Math.floor(fy), u = fx - i, v = fy - j, k = j * n + i;
    return (H[k] * (1 - u) + H[k + 1] * u) * (1 - v) + (H[k + n] * (1 - u) + H[k + n + 1] * u) * v;
  };
  const grad = (x, y, d = 0.75) => [(hAt(x + d, y) - hAt(x - d, y)) / (2 * d), (hAt(x, y + d) - hAt(x, y - d)) / (2 * d)];
  const hc = hAt(0, L);
  const g = { n, H, hAt, grad, hc, hiRes, L };
  const Vg = (x, y, lift = 0.06) => new THREE.Vector3(x, (hAt(x, y) - hc) * GEX + lift, -y);
  g.Vg = Vg;

  // least-squares plane over the green (radius GRAD_R)
  const P = [];
  for (let y = L - GRAD_R; y <= L + GRAD_R; y += 0.5) for (let x = -GRAD_R; x <= GRAD_R; x += 0.5)
    if (Math.hypot(x, y - L) <= GRAD_R) P.push([x, y - L, hAt(x, y)]);
  const mx = P.reduce((s, p) => s + p[0], 0) / P.length, my = P.reduce((s, p) => s + p[1], 0) / P.length, mh = P.reduce((s, p) => s + p[2], 0) / P.length;
  let Sxx = 0, Sxy = 0, Syy = 0, Sxh = 0, Syh = 0, hmin = 1e9, hmax = -1e9;
  for (const [x, y, z] of P) { const a = x - mx, b = y - my, c = z - mh; Sxx += a * a; Sxy += a * b; Syy += b * b; Sxh += a * c; Syh += b * c; hmin = Math.min(hmin, z); hmax = Math.max(hmax, z); }
  const det = Sxx * Syy - Sxy * Sxy;
  g.plane = { a: (Sxh * Syy - Syh * Sxy) / det, b: (Syh * Sxx - Sxh * Sxy) / det };
  g.relief = hmax - hmin;

  // mesh with the aerial photo, exaggerated relief
  const ph = model.photo, pos = new Float32Array(n * n * 3), uv = new Float32Array(n * n * 2);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const k = j * n + i, x = -GR + i * GSTEP, y = L - GR + j * GSTEP, p = fr.toLatLon(x, y), [px, py] = lonLatToPx(p.lon, p.lat, ph.z);
    pos.set([x, (H[k] - hc) * GEX, -y], k * 3); uv.set([(px - ph.ox) / ph.w, 1 - (py - ph.oy) / ph.h], k * 2);
  }
  const ind = [];
  for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) { const a = j * n + i, b = a + 1, c = a + n, d = c + 1; ind.push(a, b, c, b, d, c); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(ind); geo.computeVertexNormals();
  g.mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: terrain.material.map }));
  greenGroup.add(g.mesh);

  // contour lines every 5 cm (bold every 25 cm), marching squares
  const minor = [], major = [], STEPH = 0.05;
  const edgePt = (x0, y0, v0, x1, y1, v1, l) => { const t = (l - v0) / (v1 - v0); return [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]; };
  for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
    const x0 = -GR + i * GSTEP, y0 = L - GR + j * GSTEP, x1 = x0 + GSTEP, y1 = y0 + GSTEP;
    if (Math.hypot(x0 + GSTEP / 2, y0 + GSTEP / 2 - L) > CONTOUR_R) continue;
    const c = [[x0, y0, H[j * n + i]], [x1, y0, H[j * n + i + 1]], [x1, y1, H[(j + 1) * n + i + 1]], [x0, y1, H[(j + 1) * n + i]]];
    const lo = Math.min(...c.map(q => q[2])), hi = Math.max(...c.map(q => q[2]));
    for (let l = Math.ceil(lo / STEPH) * STEPH; l < hi; l += STEPH) {
      const pts = [];
      for (let e = 0; e < 4; e++) { const A = c[e], B = c[(e + 1) % 4]; if ((A[2] - l) * (B[2] - l) < 0) pts.push(edgePt(A[0], A[1], A[2], B[0], B[1], B[2], l)); }
      const isMajor = Math.abs(l / 0.25 - Math.round(l / 0.25)) < 1e-6, arr = isMajor ? major : minor;
      for (let q = 0; q + 1 < pts.length; q += 2) arr.push(Vg(pts[q][0], pts[q][1], 0.05), Vg(pts[q + 1][0], pts[q + 1][1], 0.05));
    }
  }
  const seg = (pts, col, op) => { const ls = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: op })); ls.renderOrder = 5; return ls; };
  if (minor.length) greenGroup.add(seg(minor, 0xffffff, 0.45));
  if (major.length) greenGroup.add(seg(major, 0xffffff, 0.95));

  // slope arrows every 2 m, coloured by steepness
  const ap = [], ac = [], col = new THREE.Color();
  for (let y = L - CONTOUR_R; y <= L + CONTOUR_R; y += 2) for (let x = -CONTOUR_R; x <= CONTOUR_R; x += 2) {
    if (Math.hypot(x, y - L) > CONTOUR_R - 1) continue;
    const [gx, gy2] = grad(x, y), s = Math.hypot(gx, gy2); if (s < 0.003) continue;
    const ux = -gx / s, uy = -gy2 / s, len = Math.min(1.8, Math.max(0.4, s * 100 * 0.45));
    const ex = x + ux * len, ey = y + uy * len, hx = ux * 0.4, hy = uy * 0.4, c = Math.cos(0.45), sn = Math.sin(0.45);
    const p0 = Vg(x - ux * len / 2, y - uy * len / 2, 0.12), p1 = Vg(ex - ux * len / 2, ey - uy * len / 2, 0.12);
    const bx = ex - ux * len / 2, by = ey - uy * len / 2;
    const w1 = Vg(bx - (hx * c - hy * sn), by - (hx * sn + hy * c), 0.12), w2 = Vg(bx - (hx * c + hy * sn), by - (-hx * sn + hy * c), 0.12);
    const pct = s * 100; col.set(pct < 1 ? 0x22c55e : pct < 2 ? 0xeab308 : pct < 3 ? 0xf97316 : 0xef4444);
    for (const q of [p0, p1, p1, w1, p1, w2]) { ap.push(q.x, q.y, q.z); ac.push(col.r, col.g, col.b); }
  }
  const ag = new THREE.BufferGeometry();
  ag.setAttribute('position', new THREE.Float32BufferAttribute(ap, 3)); ag.setAttribute('color', new THREE.Float32BufferAttribute(ac, 3));
  const arrows = new THREE.LineSegments(ag, new THREE.LineBasicMaterial({ vertexColors: true, depthTest: false })); arrows.renderOrder = 8;
  greenGroup.add(arrows);

  // flag at target & overall tilt label
  greenGroup.add(line([Vg(0, L, 0), Vg(0, L, 3)], 0xe11d48));
  greenGroup.add(label(`全体 ${greenTiltText(g)}`, 'gsum', Vg(0, L + GRAD_R + 2, 3)));
  return g;
}
function greenTiltText(g) {
  const da = -g.plane.a * 100, db = -g.plane.b * 100;   // downhill components: +x right, +y away from tee
  const fb = Math.abs(db) < 0.3 ? '前後ほぼ平ら' : db < 0 ? `受け（奥→手前へ下り）${Math.abs(db).toFixed(1)}%` : `奥へ下り ${db.toFixed(1)}%`;
  const lr = Math.abs(da) < 0.3 ? '左右ほぼ平ら' : da > 0 ? `左→右へ下り ${da.toFixed(1)}%` : `右→左へ下り ${Math.abs(da).toFixed(1)}%`;
  return `${fb} / ${lr}`;
}

async function enterGreen() {
  if (!model) return;
  if (follow.on) stopFollow();
  if (state.measure) $('btnMeasure').click();
  if (!green) {
    setLoading('グリーン周辺の詳細標高を読み込み中…');
    try { green = await buildGreen(); } catch (e) { console.error(e); alert('グリーンの標高データを読み込めませんでした'); return; } finally { setLoading(null); }
  }
  state.green = true;
  terrain.visible = false; setGroupVisible(overlay, false); setGroupVisible(pickGroup, false);
  setGroupVisible(greenGroup, true); setGroupVisible(greenPick, true);
  $('btnGreen').classList.add('on');
  const L = green.L;
  camera.position.set(0, 24, -(L - 26)); controls.target.set(0, 0, -L); controls.update();
  renderGreenTable();
  $('pickInfo').innerHTML = '<span class="stat">1回目のタップでカップ、2回目でボールの位置を置くと、ラインを読みます</span>';

function exitGreen() {
  state.green = false;
  terrain.visible = true; setGroupVisible(overlay, true); setGroupVisible(pickGroup, true);
  setGroupVisible(greenGroup, false); setGroupVisible(greenPick, false);
  $('btnGreen').classList.remove('on');
  drawOverlay();
  $('pickInfo').innerHTML = '<span class="stat">地形をタップすると、その地点までの距離を表示します</span>';

$('btnGreen').onclick = () => state.green ? (exitGreen(), teeView()) : enterGreen();

function renderGreenTable() {
  const tr = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  $('hzTable').innerHTML =
    tr('グリーン全体の傾斜（半径12m）', greenTiltText(green)) +
    tr('グリーン内の起伏（最高−最低）', `${Math.round(green.relief * 100)}cm`) +
    tr('矢印の色', '<span style="color:#16a34a">〜1%</span> <span style="color:#ca8a04">〜2%</span> <span style="color:#ea580c">〜3%</span> <span style="color:#dc2626">3%超</span>') +
    tr('等高線', '5cmごと（太線25cm）・起伏は4倍に強調') +
    tr('データ', green.hiRes ? '兵庫県 1m DEM（産総研タイル）' : '<span style="color:#dc2626">高精度データなし（5mメッシュ・目安にならない）</span>');
}

function onGreenPick(x, y) {
  if (greenPts.length >= 2) { greenPts = []; clearGroup(greenPick); }
  greenPts.push([x, y]);
  const Vg = green.Vg;
  if (greenPts.length === 1) {
    greenPick.add(line([Vg(x, y, 0), Vg(x, y, 2.2)], 0xffffff));
    greenPick.add(label('カップ', 'cup', Vg(x, y, 2.6)));
    const [gx, gy2] = green.grad(x, y);
    $('pickInfo').innerHTML = `<span class="stat">カップ周りの傾斜 <b>${(Math.hypot(gx, gy2) * 100).toFixed(1)}</b>% — 次にボールの位置をタップ</span>`;
    return;
  }
  const [[cx, cy], [bx, by]] = greenPts, d = Math.hypot(cx - bx, cy - by);
  if (d < 0.3) { greenPts.pop(); return; }
  const ux = (cx - bx) / d, uy = (cy - by) / d, rx = uy, ry = -ux;     // putt direction and its right-hand perpendicular
  const dh = green.hAt(cx, cy) - green.hAt(bx, by);                     // + = uphill putt
  let side = 0; const N = 12;
  for (let t = 0; t <= N; t++) { const px = bx + (cx - bx) * t / N, py = by + (cy - by) * t / N, [gx, gy2] = green.grad(px, py); side += -(gx * rx + gy2 * ry); }
  side = side / (N + 1) * 100;                                             // % falling to the right of the line
  const brk = Math.abs(side) < 0.4 ? 'ほぼ真っすぐ' : `${side > 0 ? '右' : '左'}に切れる（横傾斜 ${Math.abs(side).toFixed(1)}%）`;
  const ud = Math.abs(dh) < 0.02 ? 'フラット' : `${dh > 0 ? '上り' : '下り'} ${Math.round(Math.abs(dh) * 100)}cm`;
  greenPick.add(line([Vg(bx, by, 0), Vg(bx, by, 1.2)], 0xffffff));
  const pts = []; for (let t = 0; t <= 20; t++) pts.push(Vg(bx + (cx - bx) * t / 20, by + (cy - by) * t / 20, 0.15));
  greenPick.add(line(pts, 0xffffff, true));
  greenPick.add(label(`${d.toFixed(1)}m ${ud} / ${brk}`, 'ball', Vg(bx, by, 1.8)));
  $('pickInfo').innerHTML = `<span class="stat">ボール→カップ <b>${d.toFixed(1)}</b>m（約${Math.round(d / 0.75)}歩） / ${ud} / ${brk}</span>`;
}

/* ---------- wind (Open-Meteo / JMA model) ---------- */
// Open-Meteo forecast API: JMA seamless model (MSM 5 km near-term) for speed/direction; gusts from best_match because JMA has none.
const wind = { on: false, data: null, idx: 0, loading: false, points: null, parts: null, vec: null };
const DIR16 = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
const dirName = deg => DIR16[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16];
async function loadWind() {
  if (!state.tee || wind.loading) return;
  wind.loading = true; $('windInfo').hidden = false; $('windInfo').innerHTML = '<span class="stat">風の予報を取得中…</span>';
  try {
    const q = new URLSearchParams({
      latitude: state.tee.lat.toFixed(4), longitude: state.tee.lon.toFixed(4),
      hourly: 'wind_speed_10m,wind_direction_10m,wind_gusts_10m,wind_speed_80m', models: 'jma_seamless,best_match',
      wind_speed_unit: 'ms', timezone: 'Asia/Tokyo', past_hours: '2', forecast_hours: '14' });
    const r = await fetch('https://api.open-meteo.com/v1/forecast?' + q); if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(), H = j.hourly;
    const pick = (base, ...m) => { for (const s of m) { const a = H[s ? `${base}_${s}` : base]; if (a && a.some(v => v != null)) return a; } return []; };
    const sp = pick('wind_speed_10m', 'jma_seamless', 'best_match', ''), dr = pick('wind_direction_10m', 'jma_seamless', 'best_match', ''),
          gu = pick('wind_gusts_10m', 'best_match', 'jma_seamless', ''), s80 = pick('wind_speed_80m', 'best_match', 'jma_seamless', '');
    wind.data = H.time.map((t, i) => ({ t, sp: sp[i], dir: dr[i], gust: gu[i], sp80: s80[i] })).filter(d => d.sp != null && d.dir != null);
    if (!wind.data.length) throw new Error('no data');
    const now = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 13);   // JST hour
    wind.idx = Math.max(0, wind.data.findIndex(d => d.t.slice(0, 13) === now));
    $('windHour').innerHTML = wind.data.map((d, i) => `<option value="${i}">${d.t.slice(11, 16)}${i === wind.idx ? '（今）' : ''}</option>`).join('');
    $('windHour').value = wind.idx; $('windHour').hidden = false;
  } catch (e) {
    console.error(e); wind.data = null; $('windInfo').innerHTML = '<span class="stat">風の予報を取得できませんでした</span>';
  } finally { wind.loading = false; }
  if (model) drawOverlay();
}
function windComponents(d, bearing) {
  const rel = (d.dir - bearing) * D2R;          // wind FROM direction relative to the shot line
  return { head: d.sp * Math.cos(rel), cross: d.sp * Math.sin(rel) };   // head>0: 向かい風, cross>0: 右からの風
}
function drawWind() {
  if (!wind.on || !wind.data || !model) return;
  const d = wind.data[wind.idx], fr = model.fr, L = fr.L;
  const { head, cross } = windComponents(d, fr.bearing);
  // arrow showing where the wind blows to, floating over the first part of the hole
  const phi = (d.dir + 180 - fr.bearing) * D2R, dx = Math.sin(phi), dy = Math.cos(phi);
  const cy0 = Math.min(L * 0.35, 90), len = 10 + d.sp * 4, z = 18;
  const ax = -dx * len / 2, ay = cy0 - dy * len / 2, bx = dx * len / 2, by = cy0 + dy * len / 2;
  const P = (x, y) => new THREE.Vector3(x, gy(0, cy0) + z, -y);
  const hw = Math.min(6, len * 0.3), c = Math.cos(0.5), s = Math.sin(0.5);
  const w1 = P(bx - hw * (dx * c - dy * s), by - hw * (dx * s + dy * c)), w2 = P(bx - hw * (dx * c + dy * s), by - hw * (-dx * s + dy * c));
  for (const seg of [[P(ax, ay), P(bx, by)], [P(bx, by), w1], [P(bx, by), w2]]) overlay.add(line(seg, 0x0284c7));
  drawWindField(d, dx, dy);
  const gustTxt = d.gust != null ? `（最大${Math.round(d.gust)}）` : '';
  overlay.add(label(`風 ${dirName(d.dir)} ${d.sp.toFixed(1)}m/s${gustTxt}`, 'wind', P(0, cy0).add(new THREE.Vector3(0, 4, 0))));
  // carry adjustment (rule of thumb): headwind ≈ +2%/m·s, tailwind ≈ −1%/m·s of carry
  const adj = head > 0 ? 0.02 * head : 0.01 * head, tgtYd = toYd(L), play = tgtYd * (1 + adj);
  const hTxt = Math.abs(head) < 0.3 ? '縦はほぼ無風' : `${head > 0 ? '向かい' : '追い'} ${Math.abs(head).toFixed(1)}m/s`;
  const cTxt = Math.abs(cross) < 0.3 ? '横はほぼ無風' : `${cross > 0 ? '右から' : '左から'} ${Math.abs(cross).toFixed(1)}m/s`;
  $('windInfo').hidden = false;
  $('windInfo').innerHTML = `<span class="stat">${d.t.slice(11, 16)} 風 <b>${dirName(d.dir)} ${d.sp.toFixed(1)}</b>m/s${gustTxt} / ターゲットに対して ${hTxt}・${cTxt} / ${Math.round(tgtYd)}yは体感 <b>${Math.round(play)}</b>y（目安）</span>`;
}
/* wind through the whole flight volume: power-law profile u(z) = u10·(z/10)^α */
function windAlpha(d) {
  if (d.sp80 != null && d.sp > 0.5 && d.sp80 > 0) return Math.min(0.35, Math.max(0.1, Math.log(d.sp80 / d.sp) / Math.log(8)));
  return 0.2;
}
const windSpeedAt = (d, z) => d.sp * Math.pow(Math.max(2, z) / 10, windAlpha(d));
const windColor = (c, s) => c.set(s < 2 ? 0x22c55e : s < 4 ? 0xeab308 : s < 6 ? 0xf97316 : 0xef4444);
const WIND_H = [5, 20, 35];                 // heights above ground (m) for the arrow field
const WIND_VIS = 6;                         // particle speed exaggeration
function drawWindField(d, dx, dy) {
  const L = model.fr.L, col = new THREE.Color(), ap = [], ac = [];
  const c = Math.cos(0.5), s = Math.sin(0.5);
  for (const zh of WIND_H) {
    const sp = windSpeedAt(d, zh), len = Math.min(14, 3 + sp * 2.2); windColor(col, sp);
    for (let y = 10; y <= L + 20; y += 30) for (let x = -75; x <= 75; x += 30) {
      const base = gy(x, y) + zh, P = (u, v) => [x + u, base, -(y + v)];
      const a = P(-dx * len / 2, -dy * len / 2), b = P(dx * len / 2, dy * len / 2), hw = len * 0.3;
      const w1 = P(dx * len / 2 - hw * (dx * c - dy * s), dy * len / 2 - hw * (dx * s + dy * c));
      const w2 = P(dx * len / 2 - hw * (dx * c + dy * s), dy * len / 2 - hw * (-dx * s + dy * c));
      for (const q of [a, b, b, w1, b, w2]) { ap.push(...q); ac.push(col.r, col.g, col.b); }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(ap, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(ac, 3));
  overlay.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.75 })));
  for (const zh of WIND_H) {
    const yl = Math.min(L, 60);
    overlay.add(label(`高さ${zh}m ${windSpeedAt(d, zh).toFixed(1)}m/s`, 'wind', V3(-90, yl, zh)));
  }

  // typical ball path: tee → min(target, 230y), apex 30 m
  const D = Math.min(L, 230 * YD), apex = 30, path = [];
  for (let t = 0; t <= 1.0001; t += 0.025) path.push(V3(0, D * t, 4 * apex * t * (1 - t)));
  overlay.add(line(path, 0xffffff, true));
  overlay.add(label(`球の頂点付近 ${windSpeedAt(d, apex).toFixed(1)}m/s（地上10mの${(windSpeedAt(d, apex) / Math.max(0.1, d.sp)).toFixed(1)}倍）`, 'wind', V3(0, D / 2, apex + 3)));

  // drifting particles
  const N = 700, parts = new Float32Array(N * 3), pos = new Float32Array(N * 3);
  const spawn = (k, anywhere) => {
    parts[k * 3] = (Math.random() - 0.5) * 180;
    parts[k * 3 + 1] = -20 + Math.random() * (L + 50);
    parts[k * 3 + 2] = 2 + Math.random() * 43;
    if (!anywhere) { // re-enter from the upwind edge of the box
      if (Math.abs(dx) > Math.abs(dy)) parts[k * 3] = -Math.sign(dx) * 89;
      else parts[k * 3 + 1] = dy > 0 ? -19 : L + 29;
    }
  };
  for (let k = 0; k < N; k++) spawn(k, true);
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: true, transparent: true, opacity: 0.85 }));
  overlay.add(pts);
  wind.points = pts; wind.parts = parts; wind.vec = { dx, dy, d, spawn, L };
  windAnimate(0);
}
function windAnimate(dt) {
  const p = wind.points; if (!p || !p.parent || !p.visible || !model) return;
  const { dx, dy, d, spawn, L } = wind.vec, a = wind.parts, pos = p.geometry.attributes.position;
  for (let k = 0; k < a.length / 3; k++) {
    const v = windSpeedAt(d, a[k * 3 + 2]) * WIND_VIS * dt;
    a[k * 3] += dx * v; a[k * 3 + 1] += dy * v;
    const x = a[k * 3], y = a[k * 3 + 1];
    if (Math.abs(x) > 90 || y < -20 || y > L + 30) spawn(k, false);
    pos.setXYZ(k, a[k * 3], gy(a[k * 3], a[k * 3 + 1]) + a[k * 3 + 2], -a[k * 3 + 1]);
  }
  pos.needsUpdate = true;
}
$('btnWind').onclick = () => {
  wind.on = !wind.on; $('btnWind').classList.toggle('on', wind.on);
  $('windHour').hidden = !wind.on || !wind.data; $('windInfo').hidden = !wind.on;
  if (wind.on && !wind.data) loadWind(); else if (model) drawOverlay();
};
$('windHour').onchange = () => { wind.idx = +$('windHour').value; if (model) drawOverlay(); };

/* ---------- heading-follow mode (方角固定) ---------- */
const DECLINATION = -7.3;               // magnetic → true north, western Japan (approx.)
const norm360 = a => ((a % 360) + 360) % 360;
const angDiff = (a, b) => ((a - b + 540) % 360) - 180; // signed a−b in (−180,180]
function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;   // iOS (magnetic)
  else if (e.absolute && e.alpha != null) h = 360 - e.alpha;                       // Android absolute
  if (h == null) return;
  const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  h = norm360(h + so + DECLINATION);
  follow.raw = follow.raw == null ? h : norm360(follow.raw + angDiff(h, follow.raw) * 0.15);
}
const followPos = () => follow.pos || [0, 0];
function bearingToTarget(P) { return norm360(model.fr.bearing + Math.atan2(-P[0], model.fr.L - P[1]) / D2R); }

async function startFollow() {
  if (!model) return;
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { if (await DeviceOrientationEvent.requestPermission() !== 'granted') return alert('方位センサーの使用が許可されませんでした'); }
    catch { return alert('方位センサーの使用を許可できませんでした'); }
  }
  follow.on = true; follow.raw = null; follow.drawn = null; follow.pos = null;
  addEventListener('deviceorientationabsolute', onOrient);
  addEventListener('deviceorientation', onOrient);
  if (navigator.geolocation) follow.watch = navigator.geolocation.watchPosition(pos => {
    const [x, y] = model.fr.toLocal(pos.coords.latitude, pos.coords.longitude);
    follow.pos = Math.abs(x) <= LATERAL && y >= model.Y0 && y <= model.Y1 ? [x, y] : null;
  }, () => {}, { enableHighAccuracy: true, maximumAge: 2000 });
  controls.enabled = false;
  $('btnFollow').classList.add('on'); $('btnCalib').hidden = false;
  $('pickInfo').innerHTML = '<span class="stat">方角を取得中…</span>';
  follow.timer = setTimeout(() => {
    if (follow.on && follow.raw == null) { stopFollow(); alert('方位センサーの値を取得できませんでした（この端末・ブラウザは非対応の可能性があります）'); }
  }, 4000);
}
function stopFollow() {
  follow.on = false; clearTimeout(follow.timer);
  removeEventListener('deviceorientationabsolute', onOrient);
  removeEventListener('deviceorientation', onOrient);
  if (follow.watch != null) navigator.geolocation.clearWatch(follow.watch);
  follow.watch = null; clearGroup(aimGroup);
  controls.enabled = true; controls.update();
  $('btnFollow').classList.remove('on'); $('btnCalib').hidden = true;
}
$('btnFollow').onclick = () => follow.on ? stopFollow() : startFollow();
$('btnCalib').onclick = () => {
  if (!follow.on || follow.raw == null) return;
  follow.offset = angDiff(bearingToTarget(followPos()), follow.raw);
  lsSet('teevision.hdgOffset', follow.offset); follow.drawn = null;
  $('pickInfo').innerHTML = `<span class="stat">ターゲット方向で補正しました（${follow.offset >= 0 ? '+' : ''}${follow.offset.toFixed(0)}°）</span>`;
};

function updateFollow() {
  if (!model || follow.raw == null) return;
  const hdg = norm360(follow.raw + follow.offset), P = followPos();
  const phi = (hdg - model.fr.bearing) * D2R, dx = Math.sin(phi), dy = Math.cos(phi);
  const cx = P[0] - dx * 25, cy = P[1] - dy * 25, tx = P[0] + dx * 170, ty = P[1] + dy * 170;
  camera.position.set(cx, gy(cx, cy) + 32, -cy);
  controls.target.set(tx, gy(tx, ty), -ty);
  camera.lookAt(controls.target);
  const now = performance.now();
  if (now - follow.last > 150 && (!follow.drawn || Math.abs(angDiff(hdg, follow.drawn.h)) > 0.7 || follow.drawn.p !== P)) {
    drawAim(P, dx, dy, hdg); follow.drawn = { h: hdg, p: P }; follow.last = now;
  }
}
function drawAim(P, dx, dy, hdg) {
  clearGroup(aimGroup);
  const inside = (x, y) => Math.abs(x) <= LATERAL && y >= model.Y0 && y <= model.Y1;
  const pts = [];
  for (let r = 0; r <= 320 * YD; r += 4) { const x = P[0] + dx * r, y = P[1] + dy * r; if (!inside(x, y)) break; pts.push(V3(x, y, 0.8)); }
  if (pts.length > 1) aimGroup.add(line(pts, 0xd946ef));
  for (const yd of [100, 150, 200, 250, 300]) {
    const r = yd * YD, x = P[0] + dx * r, y = P[1] + dy * r; if (!inside(x, y)) break;
    aimGroup.add(line([V3(x, y, 0), V3(x, y, 4)], 0xd946ef));
    const s = model.surfAt(x, y);
    aimGroup.add(label(`${yd}y${s ? ' ' + s : ''}`, 'aim', V3(x, y, 5)));
  }
  const off = angDiff(hdg, bearingToTarget(P));
  const offTxt = Math.abs(off) < 1 ? 'ターゲット方向' : `ターゲットの${off > 0 ? '右' : '左'}${Math.abs(off).toFixed(0)}°`;
  aimGroup.add(label(`方角 ${hdg.toFixed(0)}° / ${offTxt}`, 'aimhead', V3(P[0] + dx * 12, P[1] + dy * 12, 4)));
  $('pickInfo').innerHTML = `<span class="stat">向いている方向 <b>${hdg.toFixed(0)}°</b> / ${offTxt} / ${follow.pos ? '現在地から' : 'ティーから（現在地はホール外）'}</span>`;
}

/* ---------- bookmark list import ---------- */
// Text file, one hole URL per line (same format as 「URLコピー」). Blank lines and lines starting with // or ; are ignored.
function parseBookmarks(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const s = raw.trim(); if (!s || s.startsWith('//') || s.startsWith(';')) continue;
    const i = s.indexOf('#'); if (i < 0) continue;
    const p = new URLSearchParams(s.slice(i + 1));
    const tee = parseLL(p.get('t')), tgt = parseLL(p.get('g'));
    if (!tee || !tgt) continue;
    out.push({ name: (p.get('n') || '').trim() || `ホール ${out.length + 1}`, tee, tgt });
  }
  return out;
}
async function importBookmarks(url, { quiet = false } = {}) {
  let text;
  try {
    const r = await fetch(new URL(url, location.href), { cache: 'no-cache' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    text = await r.text();
  } catch (e) {
    if (!quiet) alert(`読み込めませんでした（${e.message}）。\n別ドメインのファイルは、そのサーバーがCORSを許可している必要があります。このサイトと同じリポジトリに置くのが確実です。`);
    return 0;
  }
  const list = parseBookmarks(text);
  if (!list.length) { if (!quiet) alert('ホールのURLが見つかりませんでした'); return 0; }
  // replace all saved holes with the list (only after a successful parse, so a bad URL never wipes them)
  const holes = list.slice();
  holes.sort((a, b) => a.name.localeCompare(b.name, 'ja', { numeric: true }));
  lsSet(HKEY, holes); lsSet('teevision.bmUrl', url); renderHoles();
  const first = holes.findIndex(h => h.name === list[0].name);
  $('holeSel').value = String(first);
  if (!state.tee) $('holeSel').onchange();
  if (!quiet) alert(`${list.length}ホールを読み込みました`);
  return list.length;
}
$('bmUrl').value = lsGet('teevision.bmUrl', '');
$('btnBm').onclick = () => { const u = $('bmUrl').value.trim(); if (u) importBookmarks(u); else alert('URLを入力してください'); };

/* ---------- init ---------- */
renderHoles();
// ?bm=<url> loads a bookmark list on open (e.g. index.html?bm=bookmarks/lions-red.txt)
{ const bm = new URLSearchParams(location.search).get('bm'); if (bm) { $('bmUrl').value = bm; importBookmarks(bm, { quiet: true }); } }
if (loadHash()) {
  setPick('tgt');
  const b = [[state.tee.lat, state.tee.lon]]; if (state.tgt) b.push([state.tgt.lat, state.tgt.lon]);
  b.length > 1 ? map.fitBounds(b, { padding: [40, 40] }) : map.setView(b[0], 17);
  redraw2D();
} else {
  geocode($('q').value).then(ll => map.setView(ll, 16)).catch(() => {});
}
onResize();
</script>
